# KestrelOS desktop
#
# Edit this and the change applies next time the desktop starts.  Names or
# numbers both work.  Anything not understood is skipped, so a line can be
# commented out with a # rather than deleted.
#
# This file is on the boot volume, so it can be edited from another machine
# with the stick plugged in.  Settings writes the same file when a choice is
# made there, so the two stay in step.

# one of: Midnight, Graphite, Deep space, Forest, Daylight, Paper
theme = Midnight

# one of: Blue, Teal, Green, Amber, Red, Purple, Pink, Slate
accent = Blue

# how large everything is drawn: 1, 2 or 3
# Left out here so the system keeps choosing from the size of the screen.
# scale = 1

# Any colour the interface has, by name.
#
# The lines above choose between arrangements somebody else decided on.  These
# are for when you want one particular thing a particular colour: they are
# applied after the theme, so the theme supplies everything and these change
# only what you name.  Six hex digits, with or without the #.
#
# Every colour is settable, not a chosen few - the one you want is always the
# one missing from a shortened list.  The full set:
#
#   desktop_top  desktop_bottom
#   window  window_border  window_shadow
#   title_active  title_inactive  title_text  title_text_inactive
#   text  text_dim  text_bright
#   accent  accent_dark  accent_text
#   control  control_hover  control_press  control_border
#   field  field_border  field_text
#   taskbar  taskbar_text  taskbar_hover
#   selection  selection_text
#   warning  error  success
#   scrollbar  scrollbar_thumb
#
# colour.title_active = #1f4d3a
# colour.accent       = #7fd1a8
